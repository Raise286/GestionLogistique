# Application Name
spring.application.name=reactivep_roject

# R2DBC Configuration
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/livraison_db
spring.r2dbc.username=postgres
spring.r2dbc.password=root

# SQL Initialization Configuration - Désactivé car tables créées manuellement
spring.sql.init.mode=never

# Logging Configuration
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# Additional R2DBC Pool Configuration (optionnel)
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1

# SpringDoc OpenAPI Configuration pour WebFlux
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.webjars.prefix=/webjars